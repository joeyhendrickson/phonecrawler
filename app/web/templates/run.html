{% extends "base.html" %}
{% block title %}Run {{ output_name }} · Phone Crawler{% endblock %}
{% block content %}
<p class="mb-4 text-sm"><a href="/" class="text-tide hover:underline">← New crawl</a></p>
<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.22em] text-tide">Crawl workspace</p>
    <h1 id="run-title" class="font-display text-3xl">{{ output_name }}</h1>
    <p id="run-status" class="mt-1 font-mono text-sm text-ink-muted">Loading…</p>
  </div>
  <div id="downloads" class="flex flex-wrap gap-2"></div>
</div>

<section id="metrics" class="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"></section>

<div class="mt-8 flex flex-wrap gap-2" id="tabs">
  <button data-tab="inventory" class="tab-btn rounded-full bg-ink px-4 py-1.5 text-sm text-paper-card">Inventory</button>
  <button data-tab="occurrences" class="tab-btn rounded-full border border-paper-rule bg-paper-card px-4 py-1.5 text-sm">Occurrences</button>
  <button data-tab="coverage" class="tab-btn rounded-full border border-paper-rule bg-paper-card px-4 py-1.5 text-sm">Coverage</button>
  <button data-tab="errors" class="tab-btn rounded-full border border-paper-rule bg-paper-card px-4 py-1.5 text-sm">Errors</button>
  <button data-tab="logs" class="tab-btn rounded-full border border-paper-rule bg-paper-card px-4 py-1.5 text-sm">Logs</button>
</div>

<div class="mt-4 rounded-2xl border border-paper-rule bg-paper-card p-4 shadow-card">
  <input id="filter" placeholder="Filter this table…" class="mb-3 w-full rounded-xl border border-paper-rule bg-paper px-3 py-2 text-sm outline-none ring-tide focus:ring-2" />
  <div id="table-wrap" class="overflow-auto"></div>
</div>
<script>
  window.PHONE_CRAWLER_RUN_ID = {{ run_id|tojson }};
</script>
<script src="/static/run.js"></script>
{% endblock %}
